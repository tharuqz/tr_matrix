name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual run from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # uses latest stable (your local is 3.47.6). Pin if you need exact: flutter-version: '3.47.6'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Optional: analyze / test (remove if not needed)
      # - name: Analyze
      #   run: flutter analyze

      - name: Build APK (release, debug-signing)
        run: flutter build apk --release

      # Also build App Bundle for Play Store if you need it:
      # - name: Build AppBundle
      #   run: flutter build appbundle

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Uncomment if you build appbundle:
      # - name: Upload AAB artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-aab
      #     path: build/app/outputs/bundle/release/app-release.aab
