name: trmatrix_app
description: TR MATRIX — adaptive Flutter client (desktop + mobile).
publish_to: "none"
version: 0.5.2+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  intl: ^0.19.0
  file_picker: ^8.1.2
  record: ^6.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  cross_file: ^0.3.4
  url_launcher: ^6.3.0
  mime: ^1.0.6
  desktop_drop: ^0.5.0
  image: ^4.2.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  uuid: ^4.5.1
  flutter_webrtc: ^0.12.5
  flutter_background: ^1.3.0
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.4.2
  youtube_player_iframe: ^5.2.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.7
  youtube_explode_dart: ^2.3.9
  local_auth: ^2.3.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

dependency_overrides:
  record_linux: ^1.1.0
